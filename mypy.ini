[mypy]
mypy_path = scripts
python_version = 3.11
namespace_packages = True
explicit_package_bases = True
warn_unused_ignores = False
# Contract modules are checked strictly on their own bodies; heavy
# compute modules (revenue_core/report/forecast/research/constraints) are
# dependency surfaces, not the strict-check target (FC-1204-c scope).
follow_imports = skip
