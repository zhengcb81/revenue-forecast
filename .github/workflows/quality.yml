name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
            tools
            e2e
            compatibility
            references
            config
            examples
            agents
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pytest pyyaml requests pymupdf cryptography "ruff==0.15.18" "mypy==1.19.0"
      - name: Isolate consumer checks
        run: |
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          echo "PYTHONUTF8=1" >> "$GITHUB_ENV"
      - name: Complete CI source and forecast checks
        run: python tools/pre_push_gate.py --ci

  windows-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
            tools
            config
            references
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lifecycle test dependencies
        run: python -m pip install pytest pyyaml requests
      - name: Reproduce interrupted runs and recover the original attempt
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHON_DOTENV_DISABLED: "1"
        run: >
          python -m pytest -q --tb=short
          tests/test_rf_job_attempt_lifecycle.py
          tests/test_assurance_run_lifecycle.py
          tests/test_f4_failure_coverage.py::test_filing_transport_failure_keeps_one_safe_wire_and_cold_f4_record
