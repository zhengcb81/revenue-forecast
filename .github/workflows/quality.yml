name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
            tools
            e2e
            compatibility
            references
            config
            examples
            agents
            assurance
            audit_review
            docs
            delivery
            review_audit
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pytest pyyaml requests pymupdf cryptography "coverage==7.12.0" "pytest-xdist==3.8.0" "ruff==0.15.18" "mypy==1.19.0"
      - name: Compile shipped Python
        run: python -m compileall -q scripts tools e2e
      - name: Run owner checks and verify execution
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python tools/pre_push_gate.py --ci --revision "${{ github.event.pull_request.head.sha || github.sha }}" --evidence-dir "${{ runner.temp }}/rf-s6" --workers 4
      - name: Keep test collection and execution receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rf-s6-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/rf-s6/
          if-no-files-found: ignore
