name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run test suite
        run: python -m pytest tests -q
      - name: Run engine E2E
        run: python e2e/run_revenue_forecast_e2e.py
      - name: Installation sync check
        run: python tools/sync_installations.py
      - name: Mutation patrol
        run: python tools/mutation_patrol.py --samples 5
      - name: Publication registry audit
        run: python scripts/publication_registry.py audit
