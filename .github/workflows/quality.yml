name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
            tools
            e2e
            compatibility
            references
            config
            examples
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pytest pyyaml requests pymupdf cryptography "ruff==0.15.18" "mypy==1.19.0"
      - name: Isolate consumer checks
        run: |
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          echo "PYTHONUTF8=1" >> "$GITHUB_ENV"
      - name: Complete CI source and forecast checks
        run: python tools/pre_push_gate.py --ci
